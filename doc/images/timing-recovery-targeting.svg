<svg xmlns="http://www.w3.org/2000/svg" width="1210" height="490" viewBox="0 0 1210 490" role="img" aria-label="Recovering at full rate with per-frame targets">
<title>Recovering at full rate with per-frame targets</title>
<style>
  text { font-family: "Segoe UI Variable Text", "Segoe UI", Inter, system-ui, -apple-system, "Helvetica Neue", Arial, sans-serif;
         font-size: 13px; fill: #e6edf3; font-variant-numeric: tabular-nums; }
  .card { fill: #1f242b; fill-opacity: 0.94; stroke: #8b949e; stroke-opacity: 0.25; stroke-width: 1; }
  .title { font-size: 20px; font-weight: 600; letter-spacing: -0.01em; }
  .sub { fill: #8b949e; }
  .label { font-size: 11px; font-weight: 600; letter-spacing: 0.08em; fill: #8b949e; }
  .vsync-n { font-size: 11px; fill: #6e7681; letter-spacing: 0.04em; }
  .axis { font-size: 12px; fill: #c9d1d9; }
  .vsync { stroke: #ffffff; stroke-opacity: 0.34; stroke-width: 1; stroke-dasharray: 3 4; }
  .vsync-skip { stroke: #ffffff; stroke-opacity: 0.09; stroke-width: 1; stroke-dasharray: 2 6; }
  .vsync-target { font-size: 11px; font-weight: 600; fill: #c9d1d9; letter-spacing: 0.04em; }
  .vsync-n-skip { font-size: 11px; fill: #545b64; letter-spacing: 0.04em; }
  .box { fill: #ffffff; fill-opacity: 0.06; stroke: #ffffff; stroke-opacity: 0.22; stroke-width: 1; }
  .frame { font-size: 14px; font-weight: 700; }
  .box-time { fill: #b1bac4; font-size: 12px; }
  .arrow { stroke: #8b949e; stroke-width: 1.2; }
  .arrowhead { fill: #8b949e; }
  .ok { fill: #2ea043; }
  .hold { fill: #2ea043; fill-opacity: 0.45; }
  .again { fill: #d29922; }
  .off { fill: #e5534b; }
  .cell-text { font-size: 14px; font-weight: 700; fill: #ffffff; }
  .dark-text { fill: #1c1f24; }
  .zero { fill: #6e7681; }
  .err { fill: #ff7b72; font-weight: 600; }
  .err-pill { fill: #e5534b; fill-opacity: 0.16; }
  .neutral { fill: #3d444d; }
  .lane { font-size: 15px; font-weight: 600; }
  .same { fill: #7ee787; font-weight: 600; }
</style>
<rect class="card" x="0.5" y="0.5" width="1209" height="489" rx="14"/>
<text x="20.0" y="30.0" text-anchor="start" class="title">Recovering at full rate with per-frame targets</text>
<text x="20.0" y="54.0" text-anchor="start" class="sub">The same frames at full rate: each frame targets the refreshes its last two frames needed, so C and D get two and E is back</text>
<text x="20.0" y="73.0" text-anchor="start" class="sub">at one, a frame sooner than at half rate. It needs a present scheduled per frame; sleeping until then is only a guess.</text>
<line class="vsync-skip" x1="180.0" y1="104" x2="180.0" y2="243"/>
<text x="180.0" y="258.0" text-anchor="middle" class="axis">−100 ms</text>
<line class="vsync" x1="270.0" y1="104" x2="270.0" y2="243"/>
<text x="270.0" y="258.0" text-anchor="middle" class="axis">0 ms</text>
<text x="270.0" y="98.0" text-anchor="middle" class="vsync-target">vsync 1</text>
<line class="vsync" x1="360.0" y1="104" x2="360.0" y2="243"/>
<text x="360.0" y="258.0" text-anchor="middle" class="axis">100 ms</text>
<text x="360.0" y="98.0" text-anchor="middle" class="vsync-target">vsync 2</text>
<line class="vsync" x1="450.0" y1="104" x2="450.0" y2="243"/>
<text x="450.0" y="258.0" text-anchor="middle" class="axis">200 ms</text>
<text x="450.0" y="98.0" text-anchor="middle" class="vsync-target">vsync 3</text>
<line class="vsync-skip" x1="540.0" y1="104" x2="540.0" y2="243"/>
<text x="540.0" y="258.0" text-anchor="middle" class="vsync-n-skip">300 ms</text>
<text x="540.0" y="98.0" text-anchor="middle" class="vsync-n-skip">vsync 4</text>
<line class="vsync" x1="630.0" y1="104" x2="630.0" y2="243"/>
<text x="630.0" y="258.0" text-anchor="middle" class="axis">400 ms</text>
<text x="630.0" y="98.0" text-anchor="middle" class="vsync-target">vsync 5</text>
<line class="vsync-skip" x1="720.0" y1="104" x2="720.0" y2="243"/>
<text x="720.0" y="258.0" text-anchor="middle" class="vsync-n-skip">500 ms</text>
<text x="720.0" y="98.0" text-anchor="middle" class="vsync-n-skip">vsync 6</text>
<line class="vsync" x1="810.0" y1="104" x2="810.0" y2="243"/>
<text x="810.0" y="258.0" text-anchor="middle" class="axis">600 ms</text>
<text x="810.0" y="98.0" text-anchor="middle" class="vsync-target">vsync 7</text>
<line class="vsync" x1="900.0" y1="104" x2="900.0" y2="243"/>
<text x="900.0" y="258.0" text-anchor="middle" class="axis">700 ms</text>
<text x="900.0" y="98.0" text-anchor="middle" class="vsync-target">vsync 8</text>
<line class="vsync" x1="990.0" y1="104" x2="990.0" y2="243"/>
<text x="990.0" y="258.0" text-anchor="middle" class="axis">800 ms</text>
<text x="990.0" y="98.0" text-anchor="middle" class="vsync-target">vsync 9</text>
<line class="vsync" x1="1080.0" y1="104" x2="1080.0" y2="243"/>
<text x="1080.0" y="258.0" text-anchor="middle" class="axis">900 ms</text>
<text x="1080.0" y="98.0" text-anchor="middle" class="vsync-target">vsync 10</text>
<line class="vsync" x1="1170.0" y1="104" x2="1170.0" y2="243"/>
<text x="1170.0" y="258.0" text-anchor="middle" class="axis">1000 ms</text>
<text x="20.0" y="131.0" text-anchor="start" class="label">RENDER</text>
<text x="20.0" y="147.0" text-anchor="start" class="vsync-n">predicted display time</text>
<text x="20.0" y="222.0" text-anchor="start" class="label">DISPLAY</text>
<text x="20.0" y="294.0" text-anchor="start" class="label">ANIMATION TIME STEP</text>
<text x="20.0" y="320.0" text-anchor="start" class="label">DISPLAY TIME</text>
<text x="20.0" y="346.0" text-anchor="start" class="label">ANIMATION ERROR</text>
<rect class="box" x="204.0" y="112" width="55.5" height="44" rx="8"/>
<text x="231.8" y="131.0" text-anchor="middle" class="frame">A</text>
<text x="231.8" y="148.0" text-anchor="middle" class="box-time">0 ms</text>
<line class="arrow" x1="265.5" y1="164" x2="265.5" y2="186"/>
<path class="arrowhead" d="M260.5,185 L270.5,185 L265.5,194 z"/>
<rect class="box" x="276.0" y="112" width="100.5" height="44" rx="8"/>
<text x="326.2" y="131.0" text-anchor="middle" class="frame">B</text>
<text x="326.2" y="148.0" text-anchor="middle" class="box-time">100 ms</text>
<line class="arrow" x1="382.5" y1="164" x2="382.5" y2="186"/>
<path class="arrowhead" d="M377.5,185 L387.5,185 L382.5,194 z"/>
<rect class="box" x="456.0" y="112" width="55.5" height="44" rx="8"/>
<text x="483.8" y="131.0" text-anchor="middle" class="frame">C</text>
<text x="483.8" y="148.0" text-anchor="middle" class="box-time">400 ms</text>
<line class="arrow" x1="517.5" y1="164" x2="517.5" y2="186"/>
<path class="arrowhead" d="M512.5,185 L522.5,185 L517.5,194 z"/>
<rect class="box" x="636.0" y="112" width="55.5" height="44" rx="8"/>
<text x="663.8" y="131.0" text-anchor="middle" class="frame">D</text>
<text x="663.8" y="148.0" text-anchor="middle" class="box-time">600 ms</text>
<line class="arrow" x1="697.5" y1="164" x2="697.5" y2="186"/>
<path class="arrowhead" d="M692.5,185 L702.5,185 L697.5,194 z"/>
<rect class="box" x="816.0" y="112" width="55.5" height="44" rx="8"/>
<text x="843.8" y="131.0" text-anchor="middle" class="frame">E</text>
<text x="843.8" y="148.0" text-anchor="middle" class="box-time">700 ms</text>
<line class="arrow" x1="877.5" y1="164" x2="877.5" y2="186"/>
<path class="arrowhead" d="M872.5,185 L882.5,185 L877.5,194 z"/>
<rect class="box" x="906.0" y="112" width="55.5" height="44" rx="8"/>
<text x="933.8" y="131.0" text-anchor="middle" class="frame">F</text>
<text x="933.8" y="148.0" text-anchor="middle" class="box-time">800 ms</text>
<line class="arrow" x1="967.5" y1="164" x2="967.5" y2="186"/>
<path class="arrowhead" d="M962.5,185 L972.5,185 L967.5,194 z"/>
<rect class="box" x="996.0" y="112" width="55.5" height="44" rx="8"/>
<text x="1023.8" y="131.0" text-anchor="middle" class="frame">G</text>
<text x="1023.8" y="148.0" text-anchor="middle" class="box-time">900 ms</text>
<line class="arrow" x1="1057.5" y1="164" x2="1057.5" y2="186"/>
<path class="arrowhead" d="M1052.5,185 L1062.5,185 L1057.5,194 z"/>
<rect class="ok" x="272.0" y="198" width="86.0" height="40" rx="6"/>
<text x="315.0" y="223.0" text-anchor="middle" class="cell-text">A</text>
<text x="315.0" y="294.0" text-anchor="middle">–</text>
<text x="315.0" y="320.0" text-anchor="middle">–</text>
<text x="315.0" y="346.0" text-anchor="middle" class="zero">–</text>
<rect class="again" x="362.0" y="198" width="86.0" height="40" rx="6"/>
<text x="405.0" y="223.0" text-anchor="middle" class="cell-text dark-text">A</text>
<rect class="off" x="452.0" y="198" width="86.0" height="40" rx="6"/>
<text x="495.0" y="223.0" text-anchor="middle" class="cell-text">B</text>
<text x="495.0" y="294.0" text-anchor="middle">100 ms</text>
<text x="495.0" y="320.0" text-anchor="middle">200 ms</text>
<rect class="err-pill" x="460.1" y="331" width="69.8" height="21" rx="10.5"/>
<text x="495.0" y="346.0" text-anchor="middle" class="err">−100 ms</text>
<rect class="hold" x="542.0" y="198" width="86.0" height="40" rx="6"/>
<text x="585.0" y="223.0" text-anchor="middle" class="cell-text">B</text>
<rect class="ok" x="632.0" y="198" width="86.0" height="40" rx="6"/>
<text x="675.0" y="223.0" text-anchor="middle" class="cell-text">C</text>
<text x="675.0" y="294.0" text-anchor="middle">300 ms</text>
<text x="675.0" y="320.0" text-anchor="middle">200 ms</text>
<rect class="err-pill" x="640.1" y="331" width="69.8" height="21" rx="10.5"/>
<text x="675.0" y="346.0" text-anchor="middle" class="err">+100 ms</text>
<rect class="hold" x="722.0" y="198" width="86.0" height="40" rx="6"/>
<text x="765.0" y="223.0" text-anchor="middle" class="cell-text">C</text>
<rect class="ok" x="812.0" y="198" width="86.0" height="40" rx="6"/>
<text x="855.0" y="223.0" text-anchor="middle" class="cell-text">D</text>
<text x="855.0" y="294.0" text-anchor="middle">200 ms</text>
<text x="855.0" y="320.0" text-anchor="middle">200 ms</text>
<text x="855.0" y="346.0" text-anchor="middle" class="zero">0 ms</text>
<rect class="ok" x="902.0" y="198" width="86.0" height="40" rx="6"/>
<text x="945.0" y="223.0" text-anchor="middle" class="cell-text">E</text>
<text x="945.0" y="294.0" text-anchor="middle">100 ms</text>
<text x="945.0" y="320.0" text-anchor="middle">100 ms</text>
<text x="945.0" y="346.0" text-anchor="middle" class="zero">0 ms</text>
<rect class="ok" x="992.0" y="198" width="86.0" height="40" rx="6"/>
<text x="1035.0" y="223.0" text-anchor="middle" class="cell-text">F</text>
<text x="1035.0" y="294.0" text-anchor="middle">100 ms</text>
<text x="1035.0" y="320.0" text-anchor="middle">100 ms</text>
<text x="1035.0" y="346.0" text-anchor="middle" class="zero">0 ms</text>
<rect class="ok" x="1082.0" y="198" width="86.0" height="40" rx="6"/>
<text x="1125.0" y="223.0" text-anchor="middle" class="cell-text">G</text>
<text x="1125.0" y="294.0" text-anchor="middle">100 ms</text>
<text x="1125.0" y="320.0" text-anchor="middle">100 ms</text>
<text x="1125.0" y="346.0" text-anchor="middle" class="zero">0 ms</text>
<rect class="box" x="20" y="382" width="30" height="16" rx="4"/>
<text x="58.0" y="395.0" text-anchor="start" class="sub">render: as wide as the frame takes, labelled with its predicted display time (its animation time)</text>
<line class="arrow" x1="35.0" y1="407" x2="35.0" y2="418"/>
<path class="arrowhead" d="M31.0,417 L39.0,417 L35.0,424 z"/>
<text x="58.0" y="421.0" text-anchor="start" class="sub">present: the frame is done and waits for the vsync it is meant for</text>
<line class="vsync" x1="549.4" y1="407" x2="549.4" y2="424"/>
<line class="vsync-skip" x1="557.4" y1="407" x2="557.4" y2="424"/>
<text x="571.4" y="421.0" text-anchor="start" class="sub">vsync: bright can be targeted at the frame's rate, faint is skipped</text>
<rect class="ok" x="20.0" y="435" width="14" height="14" rx="4"/>
<text x="42.0" y="447.0" text-anchor="start" class="sub">shows the moment of its refresh</text>
<rect class="hold" x="283.9" y="435" width="14" height="14" rx="4"/>
<text x="305.9" y="447.0" text-anchor="start" class="sub">held as intended (swap interval)</text>
<rect class="again" x="554.7" y="435" width="14" height="14" rx="4"/>
<text x="576.7" y="447.0" text-anchor="start" class="sub">held: the next frame is not ready</text>
<rect class="off" x="832.4" y="435" width="14" height="14" rx="4"/>
<text x="854.4" y="447.0" text-anchor="start" class="sub">shows another moment</text>
<text x="20.0" y="472.0" text-anchor="start" class="sub">Animation error = animation time step − display time: + shown too soon, − shown too late</text>
</svg>
