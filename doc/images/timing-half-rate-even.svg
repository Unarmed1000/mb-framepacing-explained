<svg xmlns="http://www.w3.org/2000/svg" width="1420" height="490" viewBox="0 0 1420 490" role="img" aria-label="Half rate, evenly paced">
<title>Half rate, evenly paced</title>
<style>
  text { font-family: "Segoe UI Variable Text", "Segoe UI", Inter, system-ui, -apple-system, "Helvetica Neue", Arial, sans-serif;
         font-size: 13px; fill: #e6edf3; font-variant-numeric: tabular-nums; }
  .card { fill: #1f242b; fill-opacity: 0.94; stroke: #8b949e; stroke-opacity: 0.25; stroke-width: 1; }
  .title { font-size: 20px; font-weight: 600; letter-spacing: -0.01em; }
  .sub { fill: #8b949e; }
  .label { font-size: 11px; font-weight: 600; letter-spacing: 0.08em; fill: #8b949e; }
  .vsync-n { font-size: 11px; fill: #6e7681; letter-spacing: 0.04em; }
  .axis { font-size: 12px; fill: #c9d1d9; }
  .vsync { stroke: #ffffff; stroke-opacity: 0.34; stroke-width: 1; stroke-dasharray: 3 4; }
  .vsync-skip { stroke: #ffffff; stroke-opacity: 0.09; stroke-width: 1; stroke-dasharray: 2 6; }
  .vsync-target { font-size: 11px; font-weight: 600; fill: #c9d1d9; letter-spacing: 0.04em; }
  .vsync-n-skip { font-size: 11px; fill: #545b64; letter-spacing: 0.04em; }
  .box { fill: #ffffff; fill-opacity: 0.06; stroke: #ffffff; stroke-opacity: 0.22; stroke-width: 1; }
  .frame { font-size: 14px; font-weight: 700; }
  .box-time { fill: #b1bac4; font-size: 12px; }
  .arrow { stroke: #8b949e; stroke-width: 1.2; }
  .arrowhead { fill: #8b949e; }
  .ok { fill: #2ea043; }
  .hold { fill: #2ea043; fill-opacity: 0.45; }
  .again { fill: #d29922; }
  .off { fill: #e5534b; }
  .cell-text { font-size: 14px; font-weight: 700; fill: #ffffff; }
  .dark-text { fill: #1c1f24; }
  .zero { fill: #6e7681; }
  .err { fill: #ff7b72; font-weight: 600; }
  .err-pill { fill: #e5534b; fill-opacity: 0.16; }
  .neutral { fill: #3d444d; }
  .lane { font-size: 15px; font-weight: 600; }
  .same { fill: #7ee787; font-weight: 600; }
</style>
<rect class="card" x="0.5" y="0.5" width="1419" height="489" rx="14"/>
<text x="20.0" y="30.0" text-anchor="start" class="title">Half rate, evenly paced</text>
<text x="20.0" y="54.0" text-anchor="start" class="sub">Each frame is meant to stay for two refreshes (swap interval 2), like 30 fps on a 60 Hz display, and it does:</text>
<text x="20.0" y="73.0" text-anchor="start" class="sub">every step is 200 ms and every frame is on screen for 200 ms.</text>
<line class="vsync-skip" x1="180.0" y1="104" x2="180.0" y2="243"/>
<text x="180.0" y="258.0" text-anchor="middle" class="axis">−200 ms</text>
<line class="vsync" x1="420.0" y1="104" x2="420.0" y2="243"/>
<text x="420.0" y="258.0" text-anchor="middle" class="axis">0 ms</text>
<text x="420.0" y="98.0" text-anchor="middle" class="vsync-target">vsync 1</text>
<line class="vsync-skip" x1="540.0" y1="104" x2="540.0" y2="243"/>
<text x="540.0" y="258.0" text-anchor="middle" class="vsync-n-skip">100 ms</text>
<text x="540.0" y="98.0" text-anchor="middle" class="vsync-n-skip">vsync 2</text>
<line class="vsync" x1="660.0" y1="104" x2="660.0" y2="243"/>
<text x="660.0" y="258.0" text-anchor="middle" class="axis">200 ms</text>
<text x="660.0" y="98.0" text-anchor="middle" class="vsync-target">vsync 3</text>
<line class="vsync-skip" x1="780.0" y1="104" x2="780.0" y2="243"/>
<text x="780.0" y="258.0" text-anchor="middle" class="vsync-n-skip">300 ms</text>
<text x="780.0" y="98.0" text-anchor="middle" class="vsync-n-skip">vsync 4</text>
<line class="vsync" x1="900.0" y1="104" x2="900.0" y2="243"/>
<text x="900.0" y="258.0" text-anchor="middle" class="axis">400 ms</text>
<text x="900.0" y="98.0" text-anchor="middle" class="vsync-target">vsync 5</text>
<line class="vsync-skip" x1="1020.0" y1="104" x2="1020.0" y2="243"/>
<text x="1020.0" y="258.0" text-anchor="middle" class="vsync-n-skip">500 ms</text>
<text x="1020.0" y="98.0" text-anchor="middle" class="vsync-n-skip">vsync 6</text>
<line class="vsync" x1="1140.0" y1="104" x2="1140.0" y2="243"/>
<text x="1140.0" y="258.0" text-anchor="middle" class="axis">600 ms</text>
<text x="1140.0" y="98.0" text-anchor="middle" class="vsync-target">vsync 7</text>
<line class="vsync-skip" x1="1260.0" y1="104" x2="1260.0" y2="243"/>
<text x="1260.0" y="258.0" text-anchor="middle" class="vsync-n-skip">700 ms</text>
<text x="1260.0" y="98.0" text-anchor="middle" class="vsync-n-skip">vsync 8</text>
<line class="vsync" x1="1380.0" y1="104" x2="1380.0" y2="243"/>
<text x="1380.0" y="258.0" text-anchor="middle" class="axis">800 ms</text>
<text x="20.0" y="131.0" text-anchor="start" class="label">RENDER</text>
<text x="20.0" y="147.0" text-anchor="start" class="vsync-n">predicted display time</text>
<text x="20.0" y="222.0" text-anchor="start" class="label">DISPLAY</text>
<text x="20.0" y="294.0" text-anchor="start" class="label">ANIMATION TIME STEP</text>
<text x="20.0" y="320.0" text-anchor="start" class="label">DISPLAY TIME</text>
<text x="20.0" y="346.0" text-anchor="start" class="label">ANIMATION ERROR</text>
<rect class="box" x="210.0" y="112" width="168.0" height="44" rx="8"/>
<text x="294.0" y="131.0" text-anchor="middle" class="frame">A</text>
<text x="294.0" y="148.0" text-anchor="middle" class="box-time">0 ms</text>
<line class="arrow" x1="384.0" y1="164" x2="384.0" y2="186"/>
<path class="arrowhead" d="M379.0,185 L389.0,185 L384.0,194 z"/>
<rect class="box" x="426.0" y="112" width="168.0" height="44" rx="8"/>
<text x="510.0" y="131.0" text-anchor="middle" class="frame">B</text>
<text x="510.0" y="148.0" text-anchor="middle" class="box-time">200 ms</text>
<line class="arrow" x1="600.0" y1="164" x2="600.0" y2="186"/>
<path class="arrowhead" d="M595.0,185 L605.0,185 L600.0,194 z"/>
<rect class="box" x="666.0" y="112" width="168.0" height="44" rx="8"/>
<text x="750.0" y="131.0" text-anchor="middle" class="frame">C</text>
<text x="750.0" y="148.0" text-anchor="middle" class="box-time">400 ms</text>
<line class="arrow" x1="840.0" y1="164" x2="840.0" y2="186"/>
<path class="arrowhead" d="M835.0,185 L845.0,185 L840.0,194 z"/>
<rect class="box" x="906.0" y="112" width="168.0" height="44" rx="8"/>
<text x="990.0" y="131.0" text-anchor="middle" class="frame">D</text>
<text x="990.0" y="148.0" text-anchor="middle" class="box-time">600 ms</text>
<line class="arrow" x1="1080.0" y1="164" x2="1080.0" y2="186"/>
<path class="arrowhead" d="M1075.0,185 L1085.0,185 L1080.0,194 z"/>
<rect class="ok" x="422.0" y="198" width="116.0" height="40" rx="6"/>
<text x="480.0" y="223.0" text-anchor="middle" class="cell-text">A</text>
<text x="480.0" y="294.0" text-anchor="middle">–</text>
<text x="480.0" y="320.0" text-anchor="middle">–</text>
<text x="480.0" y="346.0" text-anchor="middle" class="zero">–</text>
<rect class="hold" x="542.0" y="198" width="116.0" height="40" rx="6"/>
<text x="600.0" y="223.0" text-anchor="middle" class="cell-text">A</text>
<rect class="ok" x="662.0" y="198" width="116.0" height="40" rx="6"/>
<text x="720.0" y="223.0" text-anchor="middle" class="cell-text">B</text>
<text x="720.0" y="294.0" text-anchor="middle">200 ms</text>
<text x="720.0" y="320.0" text-anchor="middle">200 ms</text>
<text x="720.0" y="346.0" text-anchor="middle" class="zero">0 ms</text>
<rect class="hold" x="782.0" y="198" width="116.0" height="40" rx="6"/>
<text x="840.0" y="223.0" text-anchor="middle" class="cell-text">B</text>
<rect class="ok" x="902.0" y="198" width="116.0" height="40" rx="6"/>
<text x="960.0" y="223.0" text-anchor="middle" class="cell-text">C</text>
<text x="960.0" y="294.0" text-anchor="middle">200 ms</text>
<text x="960.0" y="320.0" text-anchor="middle">200 ms</text>
<text x="960.0" y="346.0" text-anchor="middle" class="zero">0 ms</text>
<rect class="hold" x="1022.0" y="198" width="116.0" height="40" rx="6"/>
<text x="1080.0" y="223.0" text-anchor="middle" class="cell-text">C</text>
<rect class="ok" x="1142.0" y="198" width="116.0" height="40" rx="6"/>
<text x="1200.0" y="223.0" text-anchor="middle" class="cell-text">D</text>
<text x="1200.0" y="294.0" text-anchor="middle">200 ms</text>
<text x="1200.0" y="320.0" text-anchor="middle">200 ms</text>
<text x="1200.0" y="346.0" text-anchor="middle" class="zero">0 ms</text>
<rect class="hold" x="1262.0" y="198" width="116.0" height="40" rx="6"/>
<text x="1320.0" y="223.0" text-anchor="middle" class="cell-text">D</text>
<rect class="box" x="20" y="382" width="30" height="16" rx="4"/>
<text x="58.0" y="395.0" text-anchor="start" class="sub">render: as wide as the frame takes, labelled with its predicted display time (its animation time)</text>
<line class="arrow" x1="35.0" y1="407" x2="35.0" y2="418"/>
<path class="arrowhead" d="M31.0,417 L39.0,417 L35.0,424 z"/>
<text x="58.0" y="421.0" text-anchor="start" class="sub">present: the frame is done and waits for the vsync it is meant for</text>
<line class="vsync" x1="549.4" y1="407" x2="549.4" y2="424"/>
<line class="vsync-skip" x1="557.4" y1="407" x2="557.4" y2="424"/>
<text x="571.4" y="421.0" text-anchor="start" class="sub">vsync: bright can be targeted at the frame's rate, faint is skipped</text>
<rect class="ok" x="20.0" y="435" width="14" height="14" rx="4"/>
<text x="42.0" y="447.0" text-anchor="start" class="sub">shows the moment of its refresh</text>
<rect class="hold" x="283.9" y="435" width="14" height="14" rx="4"/>
<text x="305.9" y="447.0" text-anchor="start" class="sub">held as intended (swap interval)</text>
<text x="20.0" y="472.0" text-anchor="start" class="sub">Animation error = animation time step − display time: + shown too soon, − shown too late</text>
</svg>
