<text x="20.0" y="54.0" text-anchor="start" class="sub">A 60 Hz display, the first second of each: both show 30 frames a second, 33.3 ms per frame on average. Only how long each</text>
<text x="20.0" y="73.0" text-anchor="start" class="sub">frame stays on screen differs: two refreshes every time, or three and then one. The average frame rate cannot tell them apart.</text>
