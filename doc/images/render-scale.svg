<svg xmlns="http://www.w3.org/2000/svg" width="1180" height="445" viewBox="0 0 1180 445" role="img" aria-label="Render resolution and output resolution">
<title>Render resolution and output resolution</title>
<style>
  text { font-family: "Segoe UI Variable Text", "Segoe UI", Inter, system-ui, -apple-system, "Helvetica Neue", Arial, sans-serif;
         font-size: 13px; fill: #e6edf3; font-variant-numeric: tabular-nums; }
  .card { fill: #1f242b; fill-opacity: 0.94; stroke: #8b949e; stroke-opacity: 0.25; stroke-width: 1; }
  .title { font-size: 20px; font-weight: 600; letter-spacing: -0.01em; }
  .sub { fill: #8b949e; }
  .label { font-size: 11px; font-weight: 600; letter-spacing: 0.08em; fill: #8b949e; }
  .vsync-n { font-size: 11px; fill: #6e7681; letter-spacing: 0.04em; }
  .axis { font-size: 12px; fill: #c9d1d9; }
  .vsync { stroke: #ffffff; stroke-opacity: 0.34; stroke-width: 1; stroke-dasharray: 3 4; }
  .vsync-skip { stroke: #ffffff; stroke-opacity: 0.09; stroke-width: 1; stroke-dasharray: 2 6; }
  .vsync-target { font-size: 11px; font-weight: 600; fill: #c9d1d9; letter-spacing: 0.04em; }
  .vsync-n-skip { font-size: 11px; fill: #545b64; letter-spacing: 0.04em; }
  .box { fill: #ffffff; fill-opacity: 0.06; stroke: #ffffff; stroke-opacity: 0.22; stroke-width: 1; }
  .frame { font-size: 14px; font-weight: 700; }
  .box-time { fill: #b1bac4; font-size: 12px; }
  .arrow { stroke: #8b949e; stroke-width: 1.2; }
  .arrowhead { fill: #8b949e; }
  .ok { fill: #2ea043; }
  .hold { fill: #2ea043; fill-opacity: 0.45; }
  .again { fill: #d29922; }
  .off { fill: #e5534b; }
  .cell-text { font-size: 14px; font-weight: 700; fill: #ffffff; }
  .dark-text { fill: #1c1f24; }
  .zero { fill: #6e7681; }
  .err { fill: #ff7b72; font-weight: 600; }
  .err-pill { fill: #e5534b; fill-opacity: 0.16; }
  .neutral { fill: #3d444d; }
  .lane { font-size: 15px; font-weight: 600; }
  .same { fill: #7ee787; font-weight: 600; }

  .outline { fill: none; stroke: #8b949e; stroke-width: 1.5; stroke-dasharray: 6 4; }
  .scale-0 { fill: #58a6ff; fill-opacity: 0.12; stroke: #58a6ff; stroke-opacity: 0.5; stroke-width: 1; }
  .scale-1 { fill: #58a6ff; fill-opacity: 0.22; stroke: #58a6ff; stroke-opacity: 0.7; stroke-width: 1; }
  .scale-2 { fill: #58a6ff; fill-opacity: 0.38; stroke: #58a6ff; stroke-width: 1.5; }
  .output { fill: #2ea043; fill-opacity: 0.16; stroke: #2ea043; stroke-width: 1.5; }
  .ui { fill: none; stroke: #d29922; stroke-width: 1.5; }
  .arrow { stroke: #c9d1d9; stroke-width: 2; fill: none; }
  .arrow-head { fill: #c9d1d9; }
  .box-text { font-size: 12px; fill: #e6edf3; }
  .box-sub { font-size: 11px; fill: #8b949e; }
  .ui-text { font-size: 11px; fill: #d29922; }
</style>
<rect class="card" x="0.5" y="0.5" width="1179" height="444" rx="14"/>
<text x="20.0" y="30.0" text-anchor="start" class="title">Render resolution and output resolution</text>
<text x="20.0" y="54.0" text-anchor="start" class="sub">Drawn to scale, for a 4K display. The 3D scene renders at a lower width and height and is scaled up to the fixed output size;</text>
<text x="20.0" y="73.0" text-anchor="start" class="sub">the UI is drawn on top at full resolution, so text stays sharp. 75 % per axis is 56 % of the pixels, 50 % a quarter.</text>
<text x="110.0" y="136.0" text-anchor="start" class="label">RENDER RESOLUTION</text>
<rect class="outline" x="110" y="150" width="400" height="225"/>
<rect class="scale-0" x="110" y="150" width="400.0" height="225.0"/>
<rect class="scale-1" x="110" y="150" width="300.0" height="168.8"/>
<rect class="scale-2" x="110" y="150" width="200.0" height="112.5"/>
<text x="502.0" y="353.0" text-anchor="end" class="box-text">100 %: 3840 × 2160</text>
<text x="502.0" y="367.0" text-anchor="end" class="box-sub">all the pixels</text>
<text x="402.0" y="296.8" text-anchor="end" class="box-text">75 %: 2880 × 1620</text>
<text x="402.0" y="310.8" text-anchor="end" class="box-sub">56 % of the pixels</text>
<text x="302.0" y="240.5" text-anchor="end" class="box-text">50 %: 1920 × 1080</text>
<text x="302.0" y="254.5" text-anchor="end" class="box-sub">25 % of the pixels</text>
<line class="arrow" x1="534" y1="262.5" x2="636" y2="262.5"/>
<polygon class="arrow-head" points="646,262.5 634,256.5 634,268.5"/>
<text x="590.0" y="250.5" text-anchor="middle" class="axis">scale up</text>
<text x="670.0" y="136.0" text-anchor="start" class="label">OUTPUT: FIXED</text>
<rect class="output" x="670" y="150" width="400" height="225"/>
<text x="870.0" y="258.5" text-anchor="middle" class="box-text">3840 × 2160</text>
<text x="870.0" y="274.5" text-anchor="middle" class="box-sub">the 3D scene, scaled up</text>
<rect class="ui" x="686" y="329" width="368" height="30" rx="4"/>
<text x="870.0" y="348.0" text-anchor="middle" class="ui-text">UI and text, drawn at 3840 × 2160</text>
</svg>
