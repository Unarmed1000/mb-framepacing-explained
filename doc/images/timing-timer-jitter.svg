<rect class="card" x="0.5" y="0.5" width="1299" height="515" rx="14"/>
<text x="20.0" y="30.0" text-anchor="start" class="title">Delta time jitter: frames on time, animation time off</text>
<text x="20.0" y="54.0" text-anchor="start" class="sub">Frame rate, frametimes and display time steps are identical to the perfect timer's, but the game's clock is read at an uneven</text>
<text x="20.0" y="73.0" text-anchor="start" class="sub">point after each flip, so each frame shows a moment a little off: delta time jitter. Only the animation error reveals it.</text>
