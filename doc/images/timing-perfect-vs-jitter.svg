<rect class="card" x="0.5" y="0.5" width="1179" height="417" rx="14"/>
<text x="20.0" y="30.0" text-anchor="start" class="title">Same frame rate, same frametimes, different motion</text>
<text x="20.0" y="54.0" text-anchor="start" class="sub">A perfect timer and a jittery one, measured the usual way: 10 fps, every frame on screen for exactly 100 ms, a flat frame-time</text>
<text x="20.0" y="73.0" text-anchor="start" class="sub">graph. Every one of those numbers is identical. Only the animation time inside each frame differs, and only animation error shows it.</text>
