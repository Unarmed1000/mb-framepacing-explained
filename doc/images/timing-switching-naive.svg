<text x="42.0" y="447.0" text-anchor="start" class="sub">the frame's first refresh, neither late nor off by delta time jitter</text>
<rect class="off" x="539.2" y="435.0" width="14" height="14" rx="4"/>
<text x="561.2" y="447.0" text-anchor="start" class="sub">the frame's first refresh, late: longer than animated for and than intended</text>
<rect class="hold" x="1106.7" y="435.0" width="14" height="14" rx="4"/>
<text x="1128.7" y="447.0" text-anchor="start" class="sub">held as intended</text>
<rect class="again" x="1267.1" y="435.0" width="14" height="14" rx="4"/>
<text x="1289.1" y="447.0" text-anchor="start" class="sub">held longer: the next frame is late</text>
<text x="20.0" y="472.0" text-anchor="start" class="sub">Animation error = animation time step − display time step: + shown too soon, − shown too late</text>
</g>
</svg>
