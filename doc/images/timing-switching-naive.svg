<rect class="card" x="0.5" y="0.5" width="1779" height="515" rx="14"/>
<text x="20.0" y="30.0" text-anchor="start" class="title">Switching rates without hysteresis</text>
<text x="20.0" y="54.0" text-anchor="start" class="sub">A naive engine drops to half rate (swap interval 2) after a slow frame and goes back to full rate after the first fast one.</text>
<text x="20.0" y="73.0" text-anchor="start" class="sub">In a busy stretch the next slow frame misses its refresh again: every switch back up costs a late frame and a catch-up jump.</text>
