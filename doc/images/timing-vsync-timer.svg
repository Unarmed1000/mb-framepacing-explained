<svg xmlns="http://www.w3.org/2000/svg" width="1300" height="542" viewBox="0 0 1300 542" role="img" aria-label="The vsync timer: the same uneven clock, rounded">
<title>The vsync timer: the same uneven clock, rounded</title>
<style>
  text { font-family: "Segoe UI Variable Text", "Segoe UI", Inter, system-ui, -apple-system, "Helvetica Neue", Arial, sans-serif;
