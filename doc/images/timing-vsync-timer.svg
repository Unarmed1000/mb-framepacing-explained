<rect class="card" x="0.5" y="0.5" width="1299" height="541" rx="14"/>
<text x="20.0" y="30.0" text-anchor="start" class="title">The vsync timer: the same uneven clock, rounded</text>
<text x="20.0" y="54.0" text-anchor="start" class="sub">The clock is read as unevenly as with delta time jitter, but each measured frame time is rounded to whole refreshes. Every</text>
<text x="20.0" y="73.0" text-anchor="start" class="sub">animation time step is then exactly the time the previous frame is on screen, so the animation error is 0 on every frame.</text>
