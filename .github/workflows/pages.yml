# Build the web page and publish it on GitHub Pages: generate the blind test's clips (web-encoded, never committed), test and
# build the page, deploy web/dist. Needs Pages enabled with "GitHub Actions" as the source (Settings > Pages).
name: pages

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-26.04
    steps:
      # With the mb-framepacing submodule (external/mb-framepacing): the frame marker library of the marked clips
      - uses: actions/checkout@v5
        with:
          submodules: true

      # FFmpeg encodes the clips; Mesa's EGL renders the slides' 3D videos without a display or GPU (moderngl). moderngl's
      # glcontext has no wheel for this Python yet, so uv builds it: it needs the X11 and EGL headers.
      # The packages (about 80 with their dependencies) are kept between runs: the runner's package mirror stalls for minutes on
      # some downloads. The key is the list of package files apt would download, so an unchanged list downloads nothing, and after
      # an update of Ubuntu's packages only the changed ones are fetched (the older cache is the starting point)
      - name: The apt packages to install
        id: apt
        env:
          PACKAGES: ffmpeg libegl1 libgl1-mesa-dri libx11-dev libegl-dev
        run: |
          sudo apt-get update
          files=$(sudo apt-get install --yes --no-install-recommends --print-uris $PACKAGES | { grep "^'" || true; } | cut -d' ' -f2 | sort)
          echo "$(echo "$files" | grep -c . || true) package files"
          echo "key=$(echo "$files" | sha256sum | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"
          echo "packages=$PACKAGES" >> "$GITHUB_OUTPUT"
      - name: Cache the apt packages
        uses: actions/cache@v6
        with:
          path: ~/apt-archives
          key: apt-ubuntu-26.04-${{ steps.apt.outputs.key }}
          restore-keys: apt-ubuntu-26.04-
      - name: Install FFmpeg and OpenGL
        run: |
          mkdir -p ~/apt-archives
          sudo apt-get install --yes --no-install-recommends -o Dir::Cache::Archives="$HOME/apt-archives" -o APT::Sandbox::User=root ${{ steps.apt.outputs.packages }}
          # Package files of versions Ubuntu no longer offers leave the cache; the cache step must be able to read the rest
          sudo apt-get autoclean --yes -o Dir::Cache::Archives="$HOME/apt-archives"
          sudo chown -R "$USER" ~/apt-archives

      # uv: Python from .python-version, the packages from uv.lock (its cache keeps the wheels it downloads and builds)
      - name: uv
        uses: astral-sh/setup-uv@v10.2.0
      - name: Python packages (pyproject.toml, uv.lock)
        run: |
          uv sync --locked
          echo "$PWD/.venv/bin" >> "$GITHUB_PATH"
      - name: FFmpeg check
        run: python tools/frame_pacing_video/generate_videos.py --check-ffmpeg

      - name: Test the video tools
        run: python -m unittest discover -s tools/frame_pacing_video

      - name: Test the clip export
        run: python -m unittest discover -s tools/web_export

      - name: Generate the blind test's clips
        run: python tools/web_export/build_blind_test.py

      - uses: actions/setup-node@v5
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Test and build the page
        working-directory: web
        run: |
          npm ci
          npm run format:check
          npm test
          npm run build

      - uses: actions/configure-pages@v6

      - uses: actions/upload-pages-artifact@v5
        with:
          path: web/dist

  deploy:
    needs: build
    runs-on: ubuntu-26.04
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
